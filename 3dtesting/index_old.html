<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js glTF Viewer</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden;
            background-color: #010103;
        }
        canvas { 
            display: block; 
        }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/GLTFLoader.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/shaders/CopyShader.js"></script>

    <script>


        const MyNoiseShader = {

        uniforms: {
            tDiffuse: { value: null },
            time: { value: 0.0 }
        },

        vertexShader: `
            varying vec2 vUv;

            void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
            }
        `,

        fragmentShader: `
            uniform sampler2D tDiffuse;
            uniform float time;

            varying vec2 vUv;

            float rand(vec2 co){
                return fract(sin(dot(co.xy, vec2(12.9898,78.233))) * 43758.5453);
            }

            void main(){

                vec4 color = texture2D(tDiffuse, vUv);

                float n = rand(gl_FragCoord.xy + time);

                color.rgb += (n - 0.5) * 0.05;

                gl_FragColor = color;
            }
        `
    };



        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x010103);
        

        // Camera setup
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 0.5;

        
        // Renderer setup
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);


        //Composer setup
        const composer = new THREE.EffectComposer(renderer);

        const renderPass = new THREE.RenderPass(scene, camera);
        composer.addPass(renderPass);
        
        const noisePass = new THREE.ShaderPass(MyNoiseShader);
        composer.addPass(noisePass);

        
        // Add lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(1, 1, 1);
        scene.add(directionalLight);
        
        // Load glTF model
        const loader = new THREE.GLTFLoader();
        loader.load('test.gltf',(gltf) => {
                // Add model to scene
                scene.add(gltf.scene);
                
                
                // Apply wireframe material to all meshes
                gltf.scene.traverse((child) => {
                    if (child.isMesh) {

                        //var wire = new THREE.EdgesHelper(child,0xff00ff);
                        //scene.add(wire); 

                        createCleanWireframe(child,scene);
                        
                        /*
                        child.material = new THREE.MeshBasicMaterial({
                            color: 0x0049df,
                            wireframe: true
                        });
                        */
                        

                    }
                });
                
                
                console.log('Model loaded successfully');
                console.log(gltf);
            },
            (xhr) => {
                console.log((xhr.loaded / xhr.total * 100) + '% loaded');
            },
            (error) => {
                console.error('Error loading model:', error);
            }
        );
        
        // Add orbit controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        
        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            controls.update();
            
            //renderer.render(scene, camera);
            composer.render();
        }
        
        animate();







        // Simple, clean solution
        function createCleanWireframe(mesh, scene) {
            // Hide the original mesh
            mesh.material.visible = false;
            
            // Create edges geometry (this automatically handles visibility)
            const edgesGeometry = new THREE.EdgesGeometry(mesh.geometry, 1);
            
            // Create wireframe material
            const wireframeMaterial = new THREE.LineBasicMaterial({ 
                color: 0x0049df
            });
            
            // Create and add the wireframe
            const wireframe = new THREE.LineSegments(edgesGeometry, wireframeMaterial);
            scene.add(wireframe);
            
            return wireframe;
        }


    

    </script>
</body>
</html>
