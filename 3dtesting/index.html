<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js testing</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden;
            background: #010103;
        }
        canvas { 
            display: block; 
        }
    </style>
</head>
<body>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.185.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.185.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">

////////// Import
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // line
        import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
        import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
        import { LineMaterial } from 'three/addons/lines/LineMaterial.js';

        // Import post-processing effects
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';


////////// Create scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x010103);


////////// Create camera
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.z = 5;


////////// Create renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);


////////// Test Cube
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        //const geometry = new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1),1);
        const material = new THREE.MeshBasicMaterial({
                            color: 0x0049df,
                            wireframe: true
                        });

        //mesh
        const cube = new THREE.Mesh(geometry, material);
        cube.renderOrder = -10;
        scene.add(cube);

////////// load GLTF
        const loader = new GLTFLoader();
        var gltfmesh = null;
        loader.load(
            'test.gltf', // path to your GLTF file
            (gltf) => {
                // Add the loaded model to your scene
                //scene.add(gltf.scene);
                gltfmesh = gltf.scene.clone();
                //gltfmesh.renderOrder = -10;

                gltfmesh.traverse((child) => {
                if (child.isMesh) {
                    child.renderOrder = -0;
                }
                });
                
                scene.add(gltfmesh);
                
                // Optional: Set position, scale, or other properties
                //gltf.scene.position.set(0, 0, 0);
                gltfmesh.scale.set(10, 10, 10);
            },
            (xhr) => {
                // Progress callback
                console.log((xhr.loaded / xhr.total * 100) + '% loaded');
            },
            (error) => {
                // Error callback
                console.error('An error happened:', error);
            }
        );



////////// Unrendered occluder method 
    {
        const baseGeometry = new THREE.CylinderGeometry(1, 1, 3, 32, 1);
        //const baseGeometry = gltfmesh.clone();

        // render mesh as flat occluder
        const occluderMaterial = new THREE.MeshBasicMaterial({
        colorWrite: false, // depth-only: occludes hidden edges but paints nothing itself
        polygonOffset: true,
        polygonOffsetFactor: 1,
        polygonOffsetUnits: 1,
        });
        const occluder = new THREE.Mesh(baseGeometry, occluderMaterial);
        occluder.renderOrder = -1;
        scene.add(occluder);


        // assemble pruned edge set
        let edgesObject = null;
        
        function buildEdges(thresholdDeg) {
            if (edgesObject) {
                scene.remove(edgesObject);
                edgesObject.geometry.dispose();
            }
            
            const edgesGeo = new THREE.EdgesGeometry(baseGeometry, thresholdDeg);
            
            // Convert to LineSegmentsGeometry so we can use Line2/LineMaterial,
            // which gives reliable, controllable pixel-width lines (regular
            // LineBasicMaterial ignores linewidth on most platforms).
            const positions = edgesGeo.attributes.position.array;
            const lineGeo = new LineSegmentsGeometry();
            lineGeo.setPositions(positions);
            
            const lineMaterial = new LineMaterial({
                color: 0xff0000,      // R=255 -- the "on" value
                //linewidth: parseFloat(document.getElementById('lineWidth').value),
                linewidth: 1.5,
                worldUnits: false,     // interpret linewidth in *screen pixels*
                resolution: new THREE.Vector2(window.innerWidth, window.innerHeight),
                depthTest: true,
                depthWrite: true,
            });
            
            edgesObject = new LineSegments2(lineGeo, lineMaterial);
            edgesObject.computeLineDistances();
            scene.add(edgesObject);
            
            edgesGeo.dispose();
        }
        
        //buildEdges(parseFloat(document.getElementById('thresh').value));
        buildEdges(0.01);

    }




////////// Add lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);


////////// set up controls
        const controls = new OrbitControls( camera, renderer.domElement );


////////// Setup post-processing pipeline
        const renderPass = new RenderPass(scene, camera);
        
        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            1.5,    // strength
            0.4,    // radius
            0.85    // threshold
        );

        //chromatic aberration
        const chromaticAberrationPass = new ShaderPass(
            new THREE.ShaderMaterial({
                uniforms: {
                    tDiffuse: { value: null },
                    offset: { value: new THREE.Vector2(0.005, 0.005) }
                },
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform sampler2D tDiffuse;
                    uniform vec2 offset;
                    varying vec2 vUv;
                    
                    void main() {
                        vec2 uv = vUv;
                        
                        // Red channel
                        vec4 r = texture2D(tDiffuse, uv - offset);
                        
                        // Green channel (no offset)
                        vec4 g = texture2D(tDiffuse, uv);
                        
                        // Blue channel
                        vec4 b = texture2D(tDiffuse, uv + offset);
                        
                        gl_FragColor = vec4(r.r, g.g, b.b, 1.0);
                    }
                `
            })
        );
        
        const composer = new EffectComposer(renderer);
        composer.addPass(renderPass);
        //composer.addPass(bloomPass);
        //composer.addPass(chromaticAberrationPass);


////////// Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            //cube.rotation.x += 0.01;
            cube.rotation.y += 0.01;
            controls.update();
            
            //renderer.render(scene, camera);
            composer.render(scene, camera);
        }


////////// Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });


////////// Start animation
        animate();


    </script>
</body>
</html>
