<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js testing</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden;
            background: #010103;
        }
        canvas { 
            display: block; 
        }
    </style>
</head>
<body>
    <script type="module">

////////// Import
        import * as THREE from './three/build/three.module.js';
        import { OrbitControls } from './three/examples/jsm/controls/OrbitControls.js';
        import { GLTFLoader } from './three/examples/jsm/loaders/GLTFLoader.js';

        // Import post-processing effects
        import { EffectComposer } from './three/examples/jsm/postprocessing/EffectComposer.js';
        import { RenderPass } from './three/examples/jsm/postprocessing/RenderPass.js';
        import { ShaderPass } from './three/examples/jsm/postprocessing/ShaderPass.js';
        import { UnrealBloomPass } from './three/examples/jsm/postprocessing/UnrealBloomPass.js';


////////// Create scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x010103);


////////// Create camera
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.z = 5;


////////// Create renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);
        
////////// Create geometry and material
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const material = new THREE.MeshBasicMaterial({
                            color: 0x0049df,
                            wireframe: true
                        });


////////// Create mesh
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);


////////// load GLTF
        const loader = new GLTFLoader();
        loader.load(
            'test.gltf', // path to your GLTF file
            (gltf) => {
                // Add the loaded model to your scene
                scene.add(gltf.scene);
                
                // Optional: Set position, scale, or other properties
                gltf.scene.position.set(0, 0, 0);
                gltf.scene.scale.set(1, 1, 1);
            },
            (xhr) => {
                // Progress callback
                console.log((xhr.loaded / xhr.total * 100) + '% loaded');
            },
            (error) => {
                // Error callback
                console.error('An error happened:', error);
            }
        );


////////// Add lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);


////////// set up controls
        const controls = new OrbitControls( camera, renderer.domElement );


////////// Setup post-processing pipeline
        const renderPass = new RenderPass(scene, camera);
        
        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            1.5,    // strength
            0.4,    // radius
            0.85    // threshold
        );

        //chromatic aberration
        const chromaticAberrationPass = new ShaderPass(
            new THREE.ShaderMaterial({
                uniforms: {
                    tDiffuse: { value: null },
                    offset: { value: new THREE.Vector2(0.005, 0.005) }
                },
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform sampler2D tDiffuse;
                    uniform vec2 offset;
                    varying vec2 vUv;
                    
                    void main() {
                        vec2 uv = vUv;
                        
                        // Red channel
                        vec4 r = texture2D(tDiffuse, uv - offset);
                        
                        // Green channel (no offset)
                        vec4 g = texture2D(tDiffuse, uv);
                        
                        // Blue channel
                        vec4 b = texture2D(tDiffuse, uv + offset);
                        
                        gl_FragColor = vec4(r.r, g.g, b.b, 1.0);
                    }
                `
            })
        );
        
        const composer = new EffectComposer(renderer);
        composer.addPass(renderPass);
        //composer.addPass(bloomPass);
        composer.addPass(chromaticAberrationPass);
        

////////// Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            //cube.rotation.x += 0.01;
            cube.rotation.y += 0.01;
            controls.update();
            
            //renderer.render(scene, camera);
            composer.render(scene, camera);
        }


////////// Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });


////////// Start animation
        animate();


    </script>
</body>
</html>
